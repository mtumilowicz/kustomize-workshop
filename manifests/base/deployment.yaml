apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-api
  labels:
    app.kubernetes.io/name: inventory-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-api
    spec:
      containers:
        - name: inventory-api
          image: inventory-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: LOG_LEVEL
              value: INFO
          resources:
            limits:
              memory: 256Mi
