apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inventory-development
resources:
  - ../../base
images:
  - name: inventory-api
    newTag: dev
replicas:
  - name: inventory-api
    count: 1
labels:
  - pairs:
      app.kubernetes.io/environment: development
    includeTemplates: true
patches:
  - path: deployment-patch.yaml
