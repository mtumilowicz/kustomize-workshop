apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inventory-production
resources:
  - ../../base
images:
  - name: inventory-api
    newTag: "1.0.0"
replicas:
  - name: inventory-api
    count: 4
labels:
  - pairs:
      app.kubernetes.io/environment: production
    includeTemplates: true
patches:
  - path: deployment-patch.yaml
